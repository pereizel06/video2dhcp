<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video DHCP_A2_IzquierdoPere</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --cyan: #00d9ff;
      --blue: #2878ff;
      --bg: #020712;
      --text: #f5fbff;
    }

    html, body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(0, 217, 255, .15), transparent 38%),
        radial-gradient(circle at 15% 80%, rgba(40, 120, 255, .12), transparent 30%),
        linear-gradient(135deg, #020712, #030914 55%, #03152b);
    }

    /* Fons animat */
    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -2;
    }

    .grid {
      position: absolute;
      inset: -20%;
      background-image:
        linear-gradient(rgba(0, 217, 255, .07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 217, 255, .07) 1px, transparent 1px);
      background-size: 55px 55px;
      transform: perspective(500px) rotateX(60deg) scale(1.5);
      transform-origin: center bottom;
      animation: gridMove 12s linear infinite;
    }

    @keyframes gridMove {
      from {
        transform: perspective(500px) rotateX(60deg) scale(1.5) translateY(0);
      }
      to {
        transform: perspective(500px) rotateX(60deg) scale(1.5) translateY(55px);
      }
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(25px);
      opacity: .45;
      animation: float 8s ease-in-out infinite;
    }

    .orb.one {
      width: 350px;
      height: 350px;
      background: rgba(0, 217, 255, .13);
      left: -100px;
      top: 10%;
    }

    .orb.two {
      width: 450px;
      height: 450px;
      background: rgba(40, 120, 255, .12);
      right: -150px;
      bottom: 0;
      animation-delay: -3s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-45px) scale(1.1);
      }
    }

    /* Contingut principal */
    .container {
      width: min(1150px, 92%);
      padding: 55px 0;
      text-align: center;
    }

    .eyebrow {
      color: var(--cyan);
      font-size: .75rem;
      letter-spacing: .35em;
      text-transform: uppercase;
      margin-bottom: 18px;
      animation: fadeDown .8s ease both;
    }

    h1 {
      font-size: clamp(2.2rem, 6vw, 5.3rem);
      line-height: 1;
      letter-spacing: -.06em;
      margin-bottom: 45px;
      animation: titleIn 1s cubic-bezier(.16,1,.3,1) both;
    }

    h1 span {
      color: var(--cyan);
      text-shadow:
        0 0 15px rgba(0, 217, 255, .4),
        0 0 50px rgba(0, 217, 255, .15);
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes titleIn {
      from {
        opacity: 0;
        transform: translateY(40px) scale(.95);
        filter: blur(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    /* Vídeo */
    .video-wrapper {
      position: relative;
      padding: 10px;
      border-radius: 26px;
      background: rgba(4, 20, 39, .7);
      border: 1px solid rgba(0, 217, 255, .35);
      box-shadow:
        0 25px 80px rgba(0, 0, 0, .5),
        0 0 45px rgba(0, 217, 255, .08),
        inset 0 1px rgba(255, 255, 255, .06);
      backdrop-filter: blur(20px);
      animation: videoIn 1.1s .2s cubic-bezier(.16,1,.3,1) both;
      transition: .5s ease;
    }

    .video-wrapper:hover {
      transform: translateY(-6px);
      border-color: rgba(0, 217, 255, .7);
      box-shadow:
        0 35px 100px rgba(0, 0, 0, .55),
        0 0 60px rgba(0, 217, 255, .15);
    }

    .video-wrapper::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 28px;
      background: conic-gradient(
        from 0deg,
        transparent,
        rgba(0, 217, 255, .6),
        transparent 25%,
        rgba(40, 120, 255, .5),
        transparent 50%
      );
      z-index: -1;
      filter: blur(8px);
      opacity: .5;
      animation: borderRotate 5s linear infinite;
    }

    @keyframes borderRotate {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes videoIn {
      from {
        opacity: 0;
        transform: translateY(50px) scale(.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 18px;
      background: #000;
    }

    /* Efecte de llum */
    .scanline {
      position: fixed;
      top: -5%;
      left: 0;
      width: 100%;
      height: 2px;
      z-index: 10;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        transparent,
        var(--cyan),
        transparent
      );
      box-shadow: 0 0 20px var(--cyan);
      opacity: .18;
      animation: scan 6s linear infinite;
    }

    @keyframes scan {
      from {
        top: -5%;
      }
      to {
        top: 105%;
      }
    }

    @media (max-width: 650px) {
      .container {
        width: 94%;
        padding: 35px 0;
      }

      h1 {
        margin-bottom: 30px;
      }

      .video-wrapper {
        padding: 6px;
        border-radius: 18px;
      }

      video {
        border-radius: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="grid"></div>
    <div class="orb one"></div>
    <div class="orb two"></div>
  </div>

  <div class="scanline"></div>

  <main class="container">
    <div class="eyebrow">Projecte de xarxes</div>

    <h1>
      Video <span>DHCP_A2_IzquierdoPere</span>
    </h1>

    <div class="video-wrapper">
      <video controls autoplay muted playsinline preload="auto">
        <source src="DHCP_A2_VID_IzquierdoPere.mp4" type="video/mp4">
        El teu navegador no suporta la reproducció de vídeo.
      </video>
    </div>
  </main>

  <script>
    const video = document.querySelector("video");

    // Intentar iniciar el vídeo automàticament.
    window.addEventListener("load", () => {
      video.play().catch(() => {});
    });

    // Efecte de moviment subtil segons el ratolí.
    const wrapper = document.querySelector(".video-wrapper");

    window.addEventListener("pointermove", (e) => {
      if (window.innerWidth <= 650) return;

      const x = (e.clientX / window.innerWidth - 0.5) * 2;
      const y = (e.clientY / window.innerHeight - 0.5) * 2;

      wrapper.style.transform =
        `perspective(1200px) rotateY(${x * 1.5}deg) rotateX(${y * -1.5}deg) translateY(-4px)`;
    });

    window.addEventListener("pointerleave", () => {
      wrapper.style.transform = "";
    });
  </script>

</body>
</html>
